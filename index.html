<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        input[type="text"], input[type="number"], input[type="date"], select, textarea { font-size: 16px !important; }
        .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
        .pb-content { padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 90px); }
        
        @media print {
            @page { margin: 0; }
            body { background-color: white !important; margin: 1cm !important; }
            .no-print { display: none !important; }
            .print-full-width { max-width: 100% !important; margin: 0 !important; padding: 0 !important; }
            .print-no-shadow { box-shadow: none !important; border: none !important; }
            .page-container { background: transparent !important; box-shadow: none !important; margin: 0 !important; padding: 0 !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
        
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .soft-input { background-color: #f8fafc; border: 1px solid #cbd5e1; transition: all 0.2s ease; }
        .soft-input:focus { background-color: #ffffff; border-color: #6366f1; box-shadow: 0 0 0 3px #e0e7ff; outline: none; }
        .fade-in { animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        input, select, textarea { color: #0f172a !important; font-weight: 600 !important; }
        input::placeholder, textarea::placeholder { color: #64748b !important; font-weight: 500 !important; opacity: 1 !important; }
        label { color: #334155 !important; font-weight: 800 !important; }

        /* --- Quoter design system, inspired by kahandcrafted.com --- */
        .ka-serif { font-family: 'Playfair Display', Georgia, serif; }
        .ka-card { background: #ffffff; border: 1px solid #e3e1d9; border-radius: 6px; box-shadow: none; }
        .ka-label { display: block; font-family: 'Inter', sans-serif; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #8a8a80 !important; font-weight: 600 !important; margin-bottom: 6px; }
        .ka-input { background: #ffffff !important; border: 1px solid #d8d6cd; border-radius: 3px; padding: 0.65rem 0.85rem; font-size: 0.875rem; color: #1a1a1a !important; font-weight: 400 !important; transition: border-color .15s ease; }
        .ka-input:focus { border-color: #17181a; outline: none; box-shadow: none; }
        .ka-input::placeholder { color: #a3a29a !important; font-weight: 400 !important; }
        .ka-btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; font-family: 'Inter', sans-serif; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; border-radius: 2px; padding: 0.85rem 1.5rem; transition: all .15s ease; cursor: pointer; }
        .ka-btn-dark { background: #17181a; color: #fff; }
        .ka-btn-dark:hover { background: #000; }
        .ka-btn-outline { background: transparent; color: #17181a; border: 1px solid #17181a; }
        .ka-btn-outline:hover { background: #17181a; color: #fff; }
        .ka-btn-sm { padding: 0.5rem 0.9rem; font-size: 0.62rem; }
    </style>
</head>

            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            componentDidCatch(error, errorInfo) { console.error("App Crashed:", error, errorInfo); this.setState({ errorInfo }); }
            render() {
                if (this.state.hasError) {
                    return (
                        <div style={{ padding: '30px', fontFamily: 'sans-serif', color: '#be123c', backgroundColor: '#fff1f2', minHeight: '100vh' }}>
                            <h1 style={{ fontWeight: '900', fontSize: '28px', margin: '0 0 10px 0' }}>System Crash Detected</h1>
                            <p style={{ fontWeight: 'bold', marginBottom: '20px' }}>Please screenshot this red box and send it to me:</p>

                                <strong style={{color: 'black'}}>{this.state.error && this.state.error.toString()}</strong>
                                <br/><br/>
                                {this.state.errorInfo && this.state.errorInfo.componentStack}
                            </pre>

                    );

            }

            if (!stitches || stitches <= 0) return 0;

            const num = Number(n);
            if (!isFinite(num)) return 0;
            return Number(Math.round(Number(num + 'e2')) + 'e-2');
        };
        const formatCurrency = (val) => '$' + (val || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const generateEmptySizes = () => SIZES_LIST.reduce((acc, size) => { acc[size] = ''; return acc; }, {});

        function App() {
            const [emailConfig, setEmailConfig] = useState(() => {
                try { return JSON.parse(localStorage.getItem('email_config')) || { url: '' }; }

            const calc = useMemo(() => {
                let orderGarmentCostTotal = 0, orderGarmentRetailTotal = 0, orderDecoRetailTotal = 0, orderDecoCostTotal = 0, totalDtfCost = 0, totalThreadCost = 0, totalStabilizerCost = 0;
                
                const processedItems = items.map(item => {
                    const sizeSum = SIZES_LIST.reduce((sum, size) => sum + Math.max(0, parseInt(item.sizes?.[size]) || 0), 0);
                    const calculatedQty = sizeSum > 0 ? sizeSum : Math.max(1, parseInt(item.qty) || 1);
                    const rawCost = parseFloat(item.rawCost) || 0;
                    const shipping = parseFloat(item.shippingCost) || 0;
                    const margin = parseFloat(item.margin) || 0;
                    
                    const explicitDecoDiscount = Math.abs(parseFloat(item.decoDiscount) || 0);

                    const landedCost = rawCost + shipping;
                    const effectiveMargin = Math.min(margin, 99.9);
                    const clientGarmentPrice = roundCents(landedCost / (1 - (effectiveMargin / 100)));
                    
                    let dtfCount = 0, itemDecoPerPiece = 0, itemDecoCostPerPiece = 0, itemDtfCost = 0, itemThreadCost = 0, itemStabilizerCost = 0;
                    
                    const processedLocations = item.locations.map(loc => {
                        let baseCost = 0, matCost = 0;
                        if (loc.type === 'embroidery') {
                            baseCost = getEmbroideryCostPerPiece(parseInt(loc.stitches) || 0, calculatedQty);
                            if (loc.isPuff) baseCost += parseFloat(loc.puffMarkup) || 0;
                            let stabCost = 1.00;
                            let threadCost = roundCents((parseInt(loc.stitches) || 0) / 2500);
                            matCost = stabCost + threadCost;
                            itemStabilizerCost += stabCost; itemThreadCost += threadCost;
                        } else if (loc.type === 'dtf') {
                            dtfCount++;
                            baseCost = dtfCount === 1 ? (DTF_PRIMARY_FEES[loc.dtfSize] || 0) : (DTF_SECONDARY_FEES[loc.dtfSize] || 0);
                            matCost = DTF_MATERIAL_COSTS[loc.dtfSize] || 0;
                            itemDtfCost += matCost;
                        }
                        let adjustmentCost = parseFloat(loc.adjustment) || 0;
                        let cost = Math.max(0, baseCost + adjustmentCost);
                        itemDecoPerPiece += cost; 
                        itemDecoCostPerPiece += matCost;
                        return { ...loc, baseCost, cost, materialCost: matCost, isFirstDtf: loc.type === 'dtf' && dtfCount === 1 };
                    });
                    
                    const grossDecoPerPiece = roundCents(itemDecoPerPiece);
                    itemDecoPerPiece = Math.max(0, roundCents(itemDecoPerPiece - explicitDecoDiscount));

                    const totalGarmentCost = landedCost * calculatedQty;
                    const totalGarmentRetail = clientGarmentPrice * calculatedQty;
                    const totalDecoRetail = itemDecoPerPiece * calculatedQty;
                    const totalDecoMaterialCost = itemDecoCostPerPiece * calculatedQty;
                    const lineTotalPerPiece = clientGarmentPrice + itemDecoPerPiece;
                    const lineTotal = lineTotalPerPiece * calculatedQty;
                    const decoDiscountTotal = explicitDecoDiscount * calculatedQty;
                    
                    const itemTotalCost = landedCost + itemDecoCostPerPiece;
                    const itemProfit = lineTotalPerPiece - itemTotalCost;
                    const itemMarginPercent = lineTotalPerPiece > 0 ? (itemProfit / lineTotalPerPiece) * 100 : 0;
                    
                    const undiscountedLineTotalPerPiece = clientGarmentPrice + itemDecoPerPiece + explicitDecoDiscount;
                    const undiscountedLineTotal = undiscountedLineTotalPerPiece * calculatedQty;

                    orderGarmentCostTotal += totalGarmentCost; orderGarmentRetailTotal += totalGarmentRetail;
                    orderDecoRetailTotal += totalDecoRetail; orderDecoCostTotal += totalDecoMaterialCost;
                    totalDtfCost += itemDtfCost * calculatedQty; totalThreadCost += itemThreadCost * calculatedQty; totalStabilizerCost += itemStabilizerCost * calculatedQty;

                    const validLocations = item.locations.filter(l => l.type !== 'none');
                    const validPlacementCount = validLocations.length;

                    return { ...item, calculatedQty, sizeSum, landedCost, clientGarmentPrice, processedLocations, itemDecoPerPiece, grossDecoPerPiece, itemDecoCostPerPiece, totalGarmentRetail, totalDecoRetail, lineTotalPerPiece, lineTotal, explicitDecoDiscount, decoDiscountTotal, itemMarginPercent, undiscountedLineTotalPerPiece, undiscountedLineTotal, validPlacementCount };
                });

                const discount = Math.abs(parseFloat(orderData.discount) || 0);

                const totalDecoDiscount = processedItems.reduce((sum, item) => sum + (item.decoDiscountTotal || 0), 0);

                const grossSubtotal = subtotal + totalDecoDiscount; 
                const discountedSubtotal = Math.max(0, subtotal - discount);
                const tax = discountedSubtotal * (taxRate / 100);
                const grandTotal = discountedSubtotal + tax;
                
                const allocConsumables = discountedSubtotal * (shopSettings.fundConsumables / 100);
                const allocGrowth = discountedSubtotal * (shopSettings.fundGrowth / 100);
                const allocTax = discountedSubtotal * (shopSettings.fundTax / 100);

                const grossProfit = discountedSubtotal - orderGarmentCostTotal;
                const netProfit = grossProfit - orderDecoCostTotal - allocConsumables - allocTax - digitizingCost;
                const deposit = Math.ceil(grandTotal) / 2;
                
                const overallMarginPercent = discountedSubtotal > 0 ? (netProfit / discountedSubtotal) * 100 : 0;

                const targetRate = shopSettings.targetHourlyRate || 75;
                const maxAllowableTimeHours = netProfit > 0 && targetRate > 0 ? netProfit / targetRate : 0;
                const hrs = Math.floor(maxAllowableTimeHours);
                const mins = Math.round((maxAllowableTimeHours - hrs) * 60);
                let timeString = "";
                if (hrs > 0) timeString += `${hrs} hour${hrs !== 1 ? 's' : ''}`;
                if (hrs > 0 && mins > 0) timeString += ` and `;
                if (mins > 0 || hrs === 0) timeString += `${mins} minute${mins !== 1 ? 's' : ''}`;

                return { 
                    items: processedItems, orderGarmentCostTotal, orderDecoCostTotal, setup, digitizing, digitizingCost, rush, discount, 
                    allocConsumables, allocGrowth, allocTax, 
                    subtotal, grossSubtotal, discountedSubtotal, tax, grandTotal, netProfit, deposit, totalDiscount: totalDecoDiscount + discount,

                return { income, expenses, profit, margin };

            const kpiData = useMemo(() => {
                const activeOrders = orders.filter(o => o.stage !== 'quote' && o.stage !== 'archived');
                const pipelineValue = activeOrders.reduce((sum, o) => sum + (o.total || 0), 0);
                
                const convertedOrders = orders.filter(o => o.stage !== 'quote');
                const aov = convertedOrders.length > 0 ? convertedOrders.reduce((sum, o) => sum + (o.total || 0), 0) / convertedOrders.length : 0;
                
                const spoilageTotal = filteredByYear.filter(t => t.category === 'Spoilage / Machine Error' && t.type === 'expense').reduce((sum, t) => sum + t.netAmount, 0);
                const spoilageRate = annualTotals.expenses > 0 ? (spoilageTotal / annualTotals.expenses) * 100 : 0;

                const expenseBreakdown = ledCats.expense.map(cat => {
                    return { name: cat, value: filteredByYear.filter(t => t.category === cat && t.type === 'expense').reduce((sum, t) => sum + t.netAmount, 0) };
                }).filter(c => c.value > 0).sort((a, b) => b.value - a.value);

                const archivedIncome = orders.filter(o => o.stage === 'archived').reduce((sum, o) => sum + (o.fullData?.calc?.discountedSubtotal || 0), 0);
                
                let consTotal = archivedIncome * (shopSettings.fundConsumables / 100);
                let growthTotal = archivedIncome * (shopSettings.fundGrowth / 100);
                let taxTotal = archivedIncome * (shopSettings.fundTax / 100);

                const consSpent = transactions.filter(t => t.type === 'expense' && t.category === 'Consumables (DTF/Thread)').reduce((sum, t) => sum + t.amount, 0);
                const growthSpent = transactions.filter(t => t.type === 'expense' && t.category === 'Growth / Machine Repair').reduce((sum, t) => sum + t.amount, 0);
                const taxSpent = transactions.filter(t => t.type === 'expense' && t.category === 'Taxes Paid').reduce((sum, t) => sum + t.amount, 0);

                return { 
                    pipelineValue, aov, spoilageRate, spoilageTotal, activeJobsCount: activeOrders.length, expenseBreakdown,
                    funds: {
                        consumables: Math.max(0, consTotal - consSpent),
                        growth: Math.max(0, growthTotal - growthSpent),
                        tax: Math.max(0, taxTotal - taxSpent)
                    }
                };
            }, [orders, filteredByYear, annualTotals.expenses, shopSettings, transactions]);

            const currentLedgerType = bookTab === 'expenses' ? 'expense' : 'income';

                const target = Math.min(Math.max(parseFloat(targetMargin) || 0, 0), 99.9);
                const floor = Math.min(Math.max(shopSettings.marginYellow || 0, 0), 99.9);
                const totalCostPerEa = item.landedCost + item.itemDecoCostPerPiece;
                const currentPrice = item.lineTotalPerPiece;
                const currentMargin = item.itemMarginPercent;

                const priceForMargin = (m) => (m < 100 && m >= 0) ? totalCostPerEa / (1 - m / 100) : Infinity;

                // Required blank markup to hit a given all-in price, holding decoration price where it is.
                // Never suggest a markup that would sell the blank at or below what it cost to buy.
                const marginNeededForPrice = (price) => {
                    const requiredGarmentPrice = price - item.itemDecoPerPiece;
                    if (requiredGarmentPrice <= item.landedCost) return { value: null, reason: 'belowCost' };
                    const m = (1 - item.landedCost / requiredGarmentPrice) * 100;
                    if (m >= 99.9) return { value: null, reason: 'tooHigh' };
                    return { value: m, reason: 'ok' };
                };

                const targetPrice = priceForMargin(target);
                const floorPrice = priceForMargin(floor);

                return {
                    totalCostPerEa, currentPrice, currentMargin, target, floor,
                    targetPrice, floorPrice,
                    wiggleRoom: currentPrice - floorPrice,
                    priceDelta: targetPrice - currentPrice,

                                    {stage === 'quote' && <button onClick={() => setPdfConfig({ order: selectedOrder, type: 'proposal' })} className="ka-btn ka-btn-outline flex-1 py-2.5"><Icon name="fileText" size={14} /> Download Proposal</button>}
                                    {stage !== 'quote' && balance > 0 && <button onClick={() => setPdfConfig({ order: selectedOrder, type: 'invoice' })} className="ka-btn ka-btn-outline flex-1 py-2.5"><Icon name="fileText" size={14} /> Invoice PDF</button>}
                                    {(balance === 0 || stage === 'archived') && <button onClick={() => setPdfConfig({ order: selectedOrder, type: 'receipt' })} className="ka-btn ka-btn-outline flex-1 py-2.5"><Icon name="fileCheck" size={14} /> Receipt PDF</button>}
                                </div>

                                {stage === 'quote' && (
                                    <button onClick={() => handleSendEmail(selectedOrder)} className="ka-btn ka-btn-dark w-full py-3 text-sm">
                                        <Icon name="mail" size={16}/> Email Proposal to Customer
                                    </button>
                                )}

                                {stage !== 'quote' && stage !== 'archived' && balance > 0 && (
                                    <div className="bg-[#eef2ea] p-3 rounded border border-[#cfdcc4] flex items-center gap-3 mt-2 mb-2">
                                        <span className="text-[10px] font-semibold text-[#4b6b45] uppercase tracking-widest flex-1">Log Partial Pay:</span>
                                        <div className="relative w-1/3">
                                            <span className="absolute left-2 top-2 text-[#4b6b45] font-semibold text-sm">$</span>
                                            <input
                                                type="number"
                                                className="ka-input w-full pl-6 p-2 text-sm"
                                                placeholder="0.00"
                                                value={partialPayment}
                                                onChange={(e) => setPartialPayment(e.target.value)}
                                            />
                                        </div>
                                        <button
                                            onClick={() => handleLogPartialPayment(selectedOrder)}
                                            className="ka-btn ka-btn-dark px-4 py-2 text-sm"
                                        >
                                            Save
                                        </button>
                                    </div>
                                )}

                                {stage === 'quote' && (
                                    <button onClick={() => handleApproveQuote(selectedOrder)} className="ka-btn ka-btn-dark w-full py-3 text-sm">
                                        Approve Quote & Log Deposit
                                    </button>
                                )}
                                
                                {stage !== 'quote' && stage !== 'archived' && stage !== 'pickup' && nextStage && (
                                    <button onClick={() => advanceToNextStage(selectedOrder)} className="ka-btn ka-btn-dark w-full py-3 text-sm">
                                        Move to {nextStage.label} <Icon name="arrowRight" size={16}/>
                                    </button>
                                )}

                                {stage === 'pickup' && balance > 0 && (
                                    <button onClick={() => handleClearBalanceAndArchive(selectedOrder)} className="ka-btn ka-btn-dark w-full py-3 text-sm">
                                        Log Final Payment ({formatCurrency(balance)}) & Archive
                                    </button>
                                )}

                                {stage === 'pickup' && balance === 0 && (
                                    <button onClick={() => handleClearBalanceAndArchive(selectedOrder)} className="ka-btn ka-btn-dark w-full py-3 text-sm">
                                        Mark as Picked Up & Archive
                                    </button>
                                )}

                                {(stage === 'archived' || stage === 'quote') && (
                                    <button onClick={() => deleteOrder(selectedOrder.id)} className="w-full text-[#8a8a80] hover:text-[#9a3f2e] py-2 text-xs font-semibold uppercase tracking-widest transition-colors mt-2">
                                        Permanently Delete Record
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            const renderHiddenPDF = () => {
                if(!pdfConfig) return null;
                const { order, type } = pdfConfig;
                const { fullData } = order;
                const oData = fullData.orderData || {};
                const oCalc = fullData.calc || {};
                const title = type === 'proposal' ? 'PROPOSAL' : type === 'invoice' ? 'FINAL INVOICE' : 'RECEIPT';

                return (
                    <div style={{ position: 'absolute', top: 0, left: 0, opacity: 0.01, pointerEvents: 'none', zIndex: -9999, width: '100%', overflow: 'visible' }}>
                        <div ref={pdfGenRef} style={{ width: '8in', padding: '0.2in', boxSizing: 'border-box', backgroundColor: 'white', color: '#1a1a1a', fontFamily: "'Inter', Helvetica, Arial, sans-serif" }}>
                            
                            {/* Paid Stamp for Receipts */}
                            {(type === 'receipt' && order.balance === 0) && (
                                <div style={{ position: 'absolute', top: '120px', right: '80px', transform: 'rotate(12deg)', opacity: 0.9, border: '4px solid #4b6b45', color: '#4b6b45', padding: '10px 30px', borderRadius: '6px', pointerEvents: 'none', zIndex: 10 }}>
                                    <p style={{ margin: 0, fontSize: '32px', fontWeight: '900', textTransform: 'uppercase', letterSpacing: '4px' }}>Paid In Full</p>
                                </div>
                            )}

                            {/* Header Section */}
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', borderBottom: '3px solid #1a1a1a', paddingBottom: '30px', marginBottom: '30px' }}>
                                <div>
                                    <h1 style={{ fontFamily: "'Playfair Display', Georgia, serif", fontSize: '44px', fontWeight: '600', letterSpacing: '-1px', color: '#1a1a1a', margin: '0 0 5px 0' }}>{title}</h1>
                                    <p style={{ margin: 0, color: '#8a8a80', fontWeight: '600', fontSize: '15px' }}>Date: {new Date().toLocaleDateString()}</p>
                                    
                                    <div style={{ marginTop: '20px', fontSize: '14px', color: '#4a4a44', lineHeight: '1.5' }}>
                                        {businessDetails.name && <p style={{ margin: 0, fontWeight: '800', color: '#1a1a1a', fontSize: '16px' }}>{businessDetails.name}</p>}
                                        {businessDetails.address && <p style={{ margin: 0 }}>{businessDetails.address}</p>}
                                        {businessDetails.phone && <p style={{ margin: 0 }}>{businessDetails.phone}</p>}
                                        {businessDetails.email && <p style={{ margin: 0 }}>{businessDetails.email}</p>}
                                    </div>
                                </div>
                                <div style={{ textAlign: 'right' }}>
                                    <h2 style={{ fontFamily: "'Playfair Display', Georgia, serif", fontSize: '24px', fontWeight: '600', color: '#1a1a1a', margin: '0 0 5px 0' }}>{order.customer}</h2>
                                    {oData.orderName && <p style={{ margin: 0, color: '#4a4a44', fontSize: '16px', fontWeight: '500' }}>{oData.orderName}</p>}
                                    {oData.dateRequired && <p style={{ margin: '5px 0 0 0', color: '#8a8a80', fontSize: '14px' }}>Required By: {oData.dateRequired}</p>}
                                </div>
                            </div>

                            {/* Description & Design Notes tint boxes */}
                            <div style={{ display: 'flex', flexDirection: 'column', gap: '15px', marginBottom: '30px' }}>
                                {oData.orderDescription && (
                                    <div style={{ padding: '20px', backgroundColor: '#faf9f6', borderRadius: '6px', border: '1px solid #e3e1d9' }}>
                                        <p style={{ margin: 0, fontSize: '14px', color: '#4a4a44', lineHeight: '1.6' }}>{oData.orderDescription}</p>
                                    </div>
                                )}
                                {oData.designNotes && (
                                    <div style={{ padding: '20px', backgroundColor: '#eef1f5', borderRadius: '6px', border: '1px solid #c7d2e0' }}>
                                        <h3 style={{ margin: '0 0 5px 0', fontSize: '11px', fontWeight: '800', textTransform: 'uppercase', letterSpacing: '1px', color: '#26344d' }}>Design Notes</h3>
                                        <p style={{ margin: 0, fontSize: '14px', color: '#26344d', lineHeight: '1.6' }}>{oData.designNotes}</p>
                                    </div>
                                )}
                            </div>

                            {/* Mockup Section */}
                            {oData.mockupImage && (
                                <div style={{ marginBottom: '35px' }}>
                                    <h3 style={{ margin: '0 0 15px 0', fontSize: '12px', fontWeight: '800', textTransform: 'uppercase', letterSpacing: '1px', color: '#8a8a80', borderBottom: '1px solid #e3e1d9', paddingBottom: '8px' }}>Design Mockup</h3>
                                    <img src={oData.mockupImage} style={{ maxHeight: '2.5in', width: 'auto', borderRadius: '6px', border: '1px solid #e3e1d9', padding: '5px', backgroundColor: '#faf9f6' }} />
                                </div>
                            )}

                            {/* Table Header */}
                            <div style={{ display: 'flex', borderBottom: '2px solid #e3e1d9', paddingBottom: '10px', marginBottom: '20px', fontSize: '12px', fontWeight: '800', color: '#8a8a80', textTransform: 'uppercase', letterSpacing: '1px' }}>
                                <div style={{ width: '55%' }}>Description</div>
                                <div style={{ width: '15%', textAlign: 'center' }}>Qty</div>
                                <div style={{ width: '15%', textAlign: 'right' }}>Price</div>
                                <div style={{ width: '15%', textAlign: 'right' }}>Total</div>
                            </div>

                            {/* Line Items */}
                            {oCalc.items && oCalc.items.map((item, idx) => (
                                <div key={idx} style={{ marginBottom: '20px', paddingBottom: '20px', borderBottom: '1px solid #efeee8', breakInside: 'avoid' }}>
                                    <div style={{ display: 'flex' }}>
                                        <div style={{ width: '55%', paddingRight: '20px' }}>
                                            <p style={{ margin: '0 0 5px 0', fontFamily: "'Playfair Display', Georgia, serif", fontWeight: '600', fontSize: '20px', color: '#1a1a1a' }}>
                                                {item.name} {item.color ? ` - ${item.color}` : ''}
                                            </p>
                                            {getSizeString(item) && (
                                                <p style={{ margin: '0 0 10px 0' }}>
                                                    <span style={{ fontSize: '11px', backgroundColor: '#efeee8', border: '1px solid #e3e1d9', color: '#4a4a44', padding: '3px 12px', borderRadius: '20px', fontWeight: '700' }}>{getSizeString(item)}</span>
                                                </p>
                                            )}
                                            <div style={{ paddingLeft: '15px', borderLeft: '3px solid #c7d2e0', marginTop: '10px' }}>
                                                {item.locations.filter(l => l.type !== 'none').map((l, i) => (
                                                    <p key={i} style={{ margin: '0 0 4px 0', fontSize: '14px', color: '#4a4a44' }}>
                                                        <strong style={{ color: '#4a4a44' }}>{l.type === 'embroidery' ? (l.isPuff ? '3D Puff Emb' : 'Embroidery') : 'DTF Print'}</strong>
                                                        {` - ${PLACEMENTS.find(p=>p.id===l.placement)?.label || 'Custom'} ${l.desc ? `(${l.desc})` : ''}`}
                                                    </p>
                                                ))}
                                            </div>
                                        </div>
                                        <div style={{ width: '15%', textAlign: 'center', fontWeight: '700', fontSize: '16px', color: '#4a4a44' }}>{item.calculatedQty}</div>
                                        <div style={{ width: '15%', textAlign: 'right', fontWeight: '600', fontSize: '16px', color: '#4a4a44' }}>{formatCurrency(item.undiscountedLineTotalPerPiece)}</div>
                                        <div style={{ width: '15%', textAlign: 'right', fontWeight: '800', fontSize: '16px', color: '#1a1a1a' }}>{formatCurrency(item.undiscountedLineTotal)}</div>
                                    </div>

                                    {/* Item Discount Row */}
                                    {item.explicitDecoDiscount > 0 && (
                                        <div style={{ display: 'flex', marginTop: '12px' }}>
                                            <div style={{ width: '55%', paddingRight: '20px' }}>
                                                <p style={{ margin: 0, fontSize: '13px', color: '#4b6b45', fontWeight: '700', fontStyle: 'italic' }}>
                                                    ↳ Item Discount Applied (-{formatCurrency(item.explicitDecoDiscount)}/ea)
                                                </p>
                                            </div>
                                            <div style={{ width: '15%' }}></div>
                                            <div style={{ width: '15%' }}></div>
                                            <div style={{ width: '15%', textAlign: 'right', fontWeight: '700', fontSize: '15px', color: '#4b6b45' }}>
                                                -{formatCurrency(item.decoDiscountTotal)}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            ))}

                            {/* Setup & Digitizing & Rush PDF Rows */}
                            <div style={{ display: 'flex', marginBottom: '10px', paddingBottom: '10px', borderBottom: '1px solid #efeee8', breakInside: 'avoid' }}>
                                <div style={{ width: '55%', paddingRight: '20px' }}>
                                    <p style={{ margin: '0 0 5px 0', fontFamily: "'Playfair Display', Georgia, serif", fontWeight: '600', fontSize: '18px', color: '#1a1a1a' }}>Setup / Art Prep</p>
                                    {(oCalc.setup === 0 && oData.setupFeeReason && oData.setupFeeReason !== 'none') && <p style={{ margin: 0, fontSize: '12px', color: '#4b6b45', fontWeight: '800', textTransform: 'uppercase', letterSpacing: '0.5px' }}>{oData.setupFeeReason}</p>}
                                </div>
                                <div style={{ width: '15%', textAlign: 'center', fontWeight: '700', fontSize: '16px', color: '#4a4a44' }}>1</div>
                                <div style={{ width: '15%', textAlign: 'right', fontWeight: '600', fontSize: '16px', color: '#4a4a44' }}>{formatCurrency(oCalc.setup)}</div>
                                <div style={{ width: '15%', textAlign: 'right', fontWeight: '800', fontSize: '16px', color: (oCalc.setup === 0 && oData.setupFeeReason && oData.setupFeeReason !== 'none') ? '#4b6b45' : '#1a1a1a' }}>
                                    {(oCalc.setup === 0 && oData.setupFeeReason && oData.setupFeeReason !== 'none') ? 'WAIVED' : formatCurrency(oCalc.setup)}
                                </div>
                            </div>
                            
                            <div style={{ display: 'flex', marginBottom: '10px', paddingBottom: '10px', borderBottom: '1px solid #efeee8', breakInside: 'avoid' }}>
                                <div style={{ width: '55%', paddingRight: '20px' }}>
                                    <p style={{ margin: '0 0 5px 0', fontFamily: "'Playfair Display', Georgia, serif", fontWeight: '600', fontSize: '18px', color: '#1a1a1a' }}>Digitizing / File Conversion</p>
                                    {(oCalc.digitizing === 0 && oData.digitizingFeeReason && oData.digitizingFeeReason !== 'none') && <p style={{ margin: 0, fontSize: '12px', color: '#4b6b45', fontWeight: '800', textTransform: 'uppercase', letterSpacing: '0.5px' }}>{oData.digitizingFeeReason}</p>}
                                </div>
                                <div style={{ width: '15%', textAlign: 'center', fontWeight: '700', fontSize: '16px', color: '#4a4a44' }}>1</div>
                                <div style={{ width: '15%', textAlign: 'right', fontWeight: '600', fontSize: '16px', color: '#4a4a44' }}>{formatCurrency(oCalc.digitizing)}</div>
                                <div style={{ width: '15%', textAlign: 'right', fontWeight: '800', fontSize: '16px', color: (oCalc.digitizing === 0 && oData.digitizingFeeReason && oData.digitizingFeeReason !== 'none') ? '#4b6b45' : '#1a1a1a' }}>
                                    {(oCalc.digitizing === 0 && oData.digitizingFeeReason && oData.digitizingFeeReason !== 'none') ? 'WAIVED' : formatCurrency(oCalc.digitizing)}
                                </div>
                            </div>

                            {(parseFloat(oData.rushFee) > 0 || oData.rushFeeWaived) && (
                                <div style={{ display: 'flex', marginBottom: '20px', padding: '15px', borderRadius: '6px', backgroundColor: oData.rushFeeWaived ? '#eef2ea' : '#f7e9e5', border: oData.rushFeeWaived ? '1px solid #cfdcc4' : '1px solid #e5c3b8', breakInside: 'avoid', alignItems: 'center' }}>
                                    <div style={{ width: '55%', paddingRight: '20px' }}>
                                        <p style={{ margin: '0 0 5px 0', fontWeight: '900', fontSize: '17px', color: oData.rushFeeWaived ? '#4b6b45' : '#9a3f2e', textTransform: 'uppercase', letterSpacing: '0.5px' }}>
                                            Rush Order Surcharge
                                        </p>
                                        {oData.rushFeeWaived ? (
                                            <p style={{ margin: 0, fontSize: '12px', color: '#4b6b45', fontWeight: '800' }}>Fee Waived (Courtesy Discount)</p>
                                        ) : (
                                            <p style={{ margin: 0, fontSize: '12px', color: '#9a3f2e', fontWeight: '600' }}>Applies to all orders required in &lt; 10 working days (25% surcharge).</p>
                                        )}
                                    </div>
                                    <div style={{ width: '15%', textAlign: 'center', fontWeight: '700', fontSize: '16px', color: oData.rushFeeWaived ? '#4b6b45' : '#9a3f2e' }}>1</div>
                                    <div style={{ width: '15%', textAlign: 'right', fontWeight: '600', fontSize: '16px', color: oData.rushFeeWaived ? '#4b6b45' : '#9a3f2e' }}>
                                        {oData.rushFeeWaived ? (
                                            <span style={{ position: 'relative', display: 'inline-block', opacity: 0.7 }}>
                                                {formatCurrency(parseFloat(oData.rushFee))}
                                                <span style={{ position: 'absolute', left: 0, top: '50%', width: '100%', borderTop: '1.5px solid #4b6b45' }}></span>
                                            </span>
                                        ) : formatCurrency(oCalc.rush)}
                                    </div>
                                    <div style={{ width: '15%', textAlign: 'right', fontWeight: '900', fontSize: '16px', color: oData.rushFeeWaived ? '#4b6b45' : '#9a3f2e' }}>
                                        {oData.rushFeeWaived ? 'WAIVED' : formatCurrency(oCalc.rush)}
                                    </div>
                                </div>
                            )}

                            {/* Order Discount Line Item */}
                            {oCalc.discount > 0 && (
                                <div style={{ display: 'flex', marginBottom: '10px', paddingBottom: '10px', borderBottom: '1px solid #efeee8', breakInside: 'avoid', alignItems: 'center' }}>
                                    <div style={{ width: '55%', paddingRight: '20px' }}>
                                        <p style={{ margin: '0 0 5px 0', fontFamily: "'Playfair Display', Georgia, serif", fontWeight: '600', fontSize: '18px', color: '#4b6b45' }}>Order Discount</p>
                                    </div>
                                    <div style={{ width: '15%', textAlign: 'center', fontWeight: '700', fontSize: '16px', color: '#4b6b45' }}>1</div>
                                    <div style={{ width: '15%', textAlign: 'right', fontWeight: '600', fontSize: '16px', color: '#4b6b45' }}>-{formatCurrency(oCalc.discount)}</div>
                                    <div style={{ width: '15%', textAlign: 'right', fontWeight: '800', fontSize: '16px', color: '#4b6b45' }}>-{formatCurrency(oCalc.discount)}</div>
                                </div>
                            )}

                            {/* Totals Section */}
                            <div style={{ width: '50%', marginLeft: 'auto', marginTop: '30px', breakInside: 'avoid' }}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '10px', fontSize: '15px', color: '#4a4a44' }}>
                                    <span>Subtotal</span><span>{formatCurrency(oCalc.discountedSubtotal)}</span>
                                </div>
                                
                                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '15px', fontSize: '15px', color: '#4a4a44' }}>
                                    <span>Tax ({oData.taxRate}%)</span><span>{formatCurrency(oCalc.tax)}</span>
                                </div>
                                
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', paddingTop: '15px', borderTop: '3px solid #1a1a1a', marginBottom: '10px' }}>
                                    <span style={{ fontWeight: '900', textTransform: 'uppercase', letterSpacing: '1px' }}>Total</span>
                                    <span style={{ fontFamily: "'Playfair Display', Georgia, serif", fontSize: '32px', fontWeight: '600', color: '#26344d' }}>{formatCurrency(order.total)}</span>
                                </div>

                                {type !== 'proposal' && (
                                    <div style={{ display: 'flex', justifyContent: 'space-between', color: '#4b6b45', fontWeight: '700', marginBottom: '15px' }}>
                                        <span>Amount Paid</span><span>-{formatCurrency(order.total - order.balance)}</span>
                                    </div>
                                )}

                                {/* Balance Block matched to Quoter 2 Emerald style */}
                                <div style={{ backgroundColor: '#eef2ea', border: '1px solid #cfdcc4', padding: '15px', borderRadius: '6px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                    <span style={{ fontWeight: '900', textTransform: 'uppercase', color: '#4b6b45', fontSize: '12px', letterSpacing: '1px' }}>
                                        {type === 'proposal' ? 'Deposit Required' : 'Balance Due'}
                                    </span>
                                    <span style={{ fontFamily: "'Playfair Display', Georgia, serif", fontSize: '28px', fontWeight: '600', color: (order.balance > 0 ? '#26344d' : '#4b6b45') }}>
                                        {formatCurrency(type === 'proposal' ? order.depositAmount : order.balance)}
                                    </span>
                                </div>
                            </div>

                            <div style={{ marginTop: '60px', borderTop: '1px solid #e3e1d9', paddingTop: '20px', textAlign: 'center' }}>
                                <p style={{ margin: 0, color: '#8a8a80', fontSize: '12px', fontWeight: '500', lineHeight: '1.6' }}>
                                    {type === 'proposal' ? (
                                        <>
                                            <strong>This quote is valid for 14 days. </strong>Deposits are required to get production started; by submitting the deposit, you are agreeing to these terms.<br />
                                            Orders required under 10 business days are considered a rush order and are subject to a 25% surcharge.<br />
                                            Low quality artwork needing modifications or formatting, are subject to a $35/hr art fee (min charge 1 hr). 
                                        </>
                                    ) : (
                                        <>Thank you for choosing my small business!</>
                                    )}
                                </p>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <ErrorBoundary>
                    <div className="min-h-screen pb-content flex flex-col relative z-10">
                        <div className="bg-white border-b border-[#e3e1d9] sticky top-0 z-30 pt-safe no-print">
                            <div className="max-w-4xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4 p-4">
                                <div className="flex justify-between items-center w-full md:w-auto">
                                    <h1 className="ka-serif text-2xl flex items-center gap-2 text-[#1a1a1a]"><Icon name="layers" size={26} className="text-[#8a8a80]"/> Triple One OS</h1>
                                    {cloudConfig.enabled && (
                                        <button onClick={() => fetchCloudData()} disabled={isSyncing} className={`md:hidden p-2 rounded text-[#8a8a80] hover:text-[#1a1a1a] ${isSyncing ? 'opacity-50' : ''}`}>
                                            <Icon name="refresh" size={20} className={isSyncing ? "animate-spin text-[#26344d]" : ""} />
                                        </button>
                                    )}
                                </div>
                                
                                <div className="flex flex-col md:flex-row items-center gap-3 w-full md:w-auto">
                                    {cloudConfig.enabled && (
                                        <button onClick={() => fetchCloudData()} disabled={isSyncing} className={`hidden md:flex items-center gap-1.5 px-3 py-1.5 rounded text-xs font-semibold text-[#8a8a80] hover:text-[#1a1a1a] transition-colors ${isSyncing ? 'opacity-50' : ''}`}>
                                            <Icon name="refresh" size={14} className={isSyncing ? "animate-spin text-[#26344d]" : ""} /> {isSyncing ? 'Syncing...' : 'Refresh'}
                                        </button>
                                    )}
                                    <div className="flex bg-[#faf9f6] p-1.5 rounded border border-[#e3e1d9] w-full md:w-auto overflow-x-auto hide-scrollbar">
                                        <button onClick={() => setAppModule('quoter')} className={`flex-1 md:flex-none flex items-center justify-center gap-2 px-5 py-2 rounded text-sm font-semibold transition-all ${appModule === 'quoter' ? 'bg-white text-[#1a1a1a] shadow-sm' : 'text-[#8a8a80]'}`}><Icon name="calculator" size={18} /> Quoter</button>
                                        <button onClick={() => setAppModule('pipeline')} className={`flex-1 md:flex-none flex items-center justify-center gap-2 px-5 py-2 rounded text-sm font-semibold transition-all ${appModule === 'pipeline' ? 'bg-white text-[#1a1a1a] shadow-sm' : 'text-[#8a8a80]'}`}><Icon name="layers" size={18} /> Pipeline</button>
                                        <button onClick={() => setAppModule('bookkeeping')} className={`flex-1 md:flex-none flex items-center justify-center gap-2 px-5 py-2 rounded text-sm font-semibold transition-all ${appModule === 'bookkeeping' ? 'bg-white text-[#1a1a1a] shadow-sm' : 'text-[#8a8a80]'}`}><Icon name="wallet" size={18} /> Ledger</button>
                                        <button onClick={() => setAppModule('settings')} className={`flex-1 md:flex-none flex items-center justify-center gap-2 px-5 py-2 rounded text-sm font-semibold transition-all ${appModule === 'settings' ? 'bg-white text-[#1a1a1a] shadow-sm' : 'text-[#8a8a80]'}`}><Icon name="settings" size={18} /> Settings</button>
                                    </div>
                                </div>
                            </div>

                            {appModule === 'pipeline' && (
                                <div className="bg-[#faf9f6] border-t border-[#e3e1d9] flex justify-center p-2">
                                    <div className="flex bg-white border border-[#e3e1d9] p-1 rounded">
                                        <button onClick={() => setPipelineView('active')} className={`px-6 py-1.5 text-xs font-semibold rounded transition-all ${pipelineView === 'active' ? 'bg-[#1a1a1a] text-white' : 'text-[#8a8a80]'}`}>Active Jobs</button>
                                        <button onClick={() => setPipelineView('archive')} className={`px-6 py-1.5 text-xs font-semibold rounded transition-all flex items-center gap-1 ${pipelineView === 'archive' ? 'bg-[#1a1a1a] text-white' : 'text-[#8a8a80]'}`}><Icon name="archive" size={14}/> Completed Archives</button>
                                    </div>
                                </div>
                            )}
                        </div>

                        <div className="p-4 md:p-6 max-w-4xl w-full mx-auto flex-1 h-full relative z-20">
                            {appModule === 'quoter' && renderQuoter()}
                            {appModule === 'pipeline' && pipelineView === 'active' && renderPipelineBoard()}
                            {appModule === 'pipeline' && pipelineView === 'archive' && renderPipelineArchive()}
                            {appModule === 'bookkeeping' && renderBookkeeping()}
                            {appModule === 'settings' && renderSettings()}
                        </div>

                        {renderModal()}
                        {renderHiddenPDF()}
                    </div>
                </ErrorBoundary>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
